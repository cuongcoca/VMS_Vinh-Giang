<body class="bg-background font-body-md text-on-background min-h-screen flex items-center justify-center warehouse-bg p-margin-mobile">
<div class="w-full max-w-[440px] bg-white rounded-xl border border-outline-variant shadow-[0_8px_32px_rgba(2,36,72,0.1)] overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Brand Header Area -->
<div class="px-xl pt-xl pb-lg text-center border-b border-surface-variant bg-surface-bright">
<div class="flex flex-col items-center gap-xs">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-sm shadow-md">
<span class="material-symbols-outlined text-white text-[40px]" data-icon="warehouse">warehouse</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Vĩnh Giang</h1>
<p class="font-label-caps text-label-caps text-secondary uppercase tracking-[0.1em]">Warehouse Management System</p>
</div>
</div>
<div class="p-xl space-y-lg">
<form class="space-y-md" id="loginForm" onsubmit="return handleLogin(event)">
<!-- Username Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant flex justify-between" for="username">
                        TÊN ĐĂNG NHẬP
                        <span class="text-error">*</span>
</label>
<div class="relative scanner-focus transition-all duration-200 border border-outline rounded-lg bg-white overflow-hidden">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="person">person</span>
</div>
<input class="block w-full pl-[44px] pr-xl py-[14px] bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-outline" id="username" name="username" placeholder="Nhập tên đăng nhập hoặc mã NV" required="" type="text"/>
<div class="absolute inset-y-0 right-0 pr-md flex items-center">
<span class="material-symbols-outlined text-primary-container cursor-pointer hover:text-secondary transition-colors" data-icon="barcode_scanner">barcode_scanner</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant flex justify-between" for="password">
                        MẬT KHẨU
                        <span class="text-error">*</span>
</label>
<div class="relative scanner-focus transition-all duration-200 border border-outline rounded-lg bg-white overflow-hidden">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-[44px] pr-[44px] py-[14px] bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-outline" id="password" name="password" placeholder="Nhập mật khẩu truy cập" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary-container transition-colors" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Utilities Row -->
<div class="flex items-center justify-between pt-xs">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline text-primary-container focus:ring-primary-container/20 transition-all" type="checkbox"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ghi nhớ đăng nhập</span>
</label>
<a class="font-body-sm text-body-sm text-secondary font-semibold hover:underline underline-offset-4" href="#">Quên mật khẩu?</a>
</div>
<!-- Login Button -->
<button class="w-full h-[52px] bg-primary-container text-white font-headline-sm text-headline-sm rounded-xl flex items-center justify-center gap-sm hover:bg-primary transition-all active:scale-[0.98] shadow-sm relative overflow-hidden group" id="loginBtn" type="submit">
<span id="btnText">Đăng nhập</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward" id="btnIcon">arrow_forward</span>

<div class="hidden absolute inset-0 bg-primary-container flex items-center justify-center" id="loader">
<div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
</div>
</button>

<span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>

</div>

<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Hướng dẫn</a>
</div>
</div>
</div>
</div>
<!-- Background Image Prompt Meta (Hidden) -->
<div data-alt="A wide-angle perspective of a massive, state-of-the-art industrial logistics warehouse with high-tech automated shelving systems and clean concrete floors. The scene is bathed in professional, cool-toned lighting with deep navy and steel gray accents, conveying a sense of premium enterprise efficiency. Soft volumetric light filters through high windows, creating a cinematic atmosphere. The overall aesthetic is rugged yet ultra-modern and digitally integrated." style="display:none;"></div>
<script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwd.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            // Show loading animation
            loader.classList.remove('hidden');
            btnText.classList.add('opacity-0');
            btnIcon.classList.add('opacity-0');
            btn.disabled = true;

            // Simulate server delay
            setTimeout(() => {
                // Success visual feedback
                loader.innerHTML = '<span class="material-symbols-outlined text-white animate-bounce" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
                setTimeout(() => {
                    alert('Đăng nhập thành công! Đang chuyển hướng đến Dashboard...');
                    // Reset for demo
                    loader.classList.add('hidden');
                    loader.innerHTML = '<div class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>';
                    btnText.classList.remove('opacity-0');
                    btnIcon.classList.remove('opacity-0');
                    btn.disabled = false;
                }, 1000);
            }, 1500);

            return false;
        }

        // Apply focus styles for inputs based on design system
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.scanner-focus').style.boxShadow = '0 0 0 4px rgba(155, 69, 0, 0.1)';
            });
            input.addEventListener('blur', () => {
                input.closest('.scanner-focus').style.boxShadow = 'none';
            });
        });
    </script>
