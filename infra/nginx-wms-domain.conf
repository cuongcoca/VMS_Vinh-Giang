# WMS Vĩnh Giang — wms.vinhgiang.com
# Tạm thời chỉ port 80 + ACME challenge → certbot. Sau khi cert có,
# `certbot --nginx` sẽ tự thêm block 443 + redirect HTTP → HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name wms.vinhgiang.com;

    client_max_body_size 25M;
    client_body_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/wms_access.log;
    error_log  /var/log/nginx/wms_error.log;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1024;

    # ACME challenge for Let's Encrypt (HTTP-01)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # Redirect root → /wms
    location = / {
        return 302 /wms;
    }

    # Proxy to Next.js app on 4200
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
