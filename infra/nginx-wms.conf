# WMS Vĩnh Giang v2 — nginx reverse proxy
# Single Next.js 16 app at basePath /wms, listening on 127.0.0.1:4200

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25M;
    client_body_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/wms_access.log;
    error_log  /var/log/nginx/wms_error.log;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1024;

    # Redirect root → /wms (matches next.config.ts redirect, but at edge so it's free)
    location = / {
        return 302 /wms;
    }

    # Everything (including /wms, /wms/api, /_next, /uploads) → Next.js app
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
